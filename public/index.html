<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nuk_POS</title>
<link rel="stylesheet" href="/css/nukpos.css">
<link rel="icon" type="image/png" href="/img/favicon.png">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Nuk_POS">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/pwa.css">
<link rel="stylesheet" href="/css/marca.css">
</head>
<body>

<!-- ── SPLASH (arranque do sistema) ─────────────────────
     Mesma imagem usada no formulário principal (login), abaixo — só a escrita, sem emblema
     por cima (pedido do utilizador em 01/11/2026: "não quero nada por cima da escrita").
     Desaparece sozinho ao fim de pouco tempo — ver nukpos.js. ─────────────────────────────── -->
<div id="tela-splash" class="tela-splash">
  <span class="marca marca--xl"><img src="/img/logo-nukpos-texto.png" alt="Nuk_POS Sistema Integrado" width="597" height="176"></span>
</div>

<!-- ── LOGIN ─────────────────────────────────────────── -->
<div id="tela-login" class="tela-login">
  <div class="login-card">
    <div class="login-logo">
      <span class="marca marca--xl"><img src="/img/logo-nukpos-texto.png" alt="Nuk_POS Sistema Integrado" width="597" height="176"></span>
    </div>
    <form id="form-login">
      <div class="campo">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="email@nukpos.ao" autocomplete="username" required>
      </div>
      <div class="campo">
        <label>Senha</label>
        <input type="password" id="login-senha" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primario btn-bloco" id="btn-entrar">Entrar</button>
      <div id="login-erro" class="erro-msg" style="display:none"></div>
    </form>
  </div>
</div>

<!-- ── APP PRINCIPAL ──────────────────────────────────── -->
<div id="app" style="display:none">

  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo"><span class="marca marca--sm"><img src="/img/logo-nukpos-texto.png" alt="Nuk_POS Sistema Integrado" width="597" height="176"></span></div>
      <button class="btn-fechar-sidebar" data-action="toggle-sidebar">✕</button>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-modulo="dashboard">
        <span class="nav-icon">📊</span><span>Dashboard</span>
      </button>
      <div class="nav-grupo"><div class="nav-titulo">Caixa</div>
        <button class="nav-item" data-modulo="caixa">
          <span class="nav-icon">💵</span><span>Caixa do dia</span>
        </button>
        <button class="nav-item" data-modulo="nukcoin">
          <span class="nav-icon">💜</span><span>Nuk-Coin</span>
        </button>
        <button class="nav-item" data-modulo="cartoes">
          <span class="nav-icon">💳</span><span>Cartões de consumo</span>
        </button>
        <button class="nav-item" data-modulo="recebimentos">
          <span class="nav-icon">🧾</span><span>Receber mesas</span>
        </button>
        <button class="nav-item" data-modulo="clientes">
          <span class="nav-icon">👥</span><span>Clientes</span>
        </button>
      </div>
      <div class="nav-grupo"><div class="nav-titulo">Vendas</div>
        <div class="nav-sub"><div class="nav-subtitulo">Fluxo de venda</div>
        <button class="nav-item" data-modulo="mesas">
          <span class="nav-icon">🪑</span><span>Mesa</span>
        </button>
        <button class="nav-item" data-modulo="balcao">
          <span class="nav-icon">🧾</span><span>Balcão</span>
        </button>
        <button class="nav-item" data-modulo="remota">
          <span class="nav-icon">📱</span><span>Remota</span>
          <span id="badge-remota" class="badge" style="display:none">0</span>
        </button>
        <button class="nav-item" data-modulo="takeaway">
          <span class="nav-icon">🥡</span><span>Take Away</span>
        </button>
        </div>
        <div class="nav-sub"><div class="nav-subtitulo">Restauração</div>
        <button class="nav-item" data-modulo="pedidos">
          <span class="nav-icon">🍽️</span><span>Pedidos</span>
          <span id="badge-pedidos" class="badge" style="display:none">0</span>
        </button>
        <button class="nav-item" data-modulo="produtos">
          <span class="nav-icon">📋</span><span>Menu / Produtos</span>
        </button>
        </div>
        <div class="nav-sub"><div class="nav-subtitulo">Hospedagem</div>
        <button class="nav-item" data-modulo="quartos">
          <span class="nav-icon">🛏️</span><span>Quartos</span>
        </button>
        </div>
        <button class="nav-item" data-modulo="solicitacoes">
          <span class="nav-icon">🔔</span><span>Solicitações</span>
          <span id="badge-solicitacoes" class="badge" style="display:none">0</span>
        </button>
      </div>
      <div class="nav-grupo"><div class="nav-titulo">Compras</div>
        <button class="nav-item" data-modulo="compras">
          <span class="nav-icon">🛒</span><span>Compras pontuais</span>
        </button>
        <button class="nav-item" data-modulo="stock">
          <span class="nav-icon">📦</span><span>Stock</span>
          <span id="badge-stock" class="badge badge-aviso" style="display:none">!</span>
        </button>
      </div>
      <div class="nav-grupo"><div class="nav-titulo">Serviços</div>
        <button class="nav-item" data-modulo="servicos">
          <span class="nav-icon">🛠️</span><span>Avarias e danos</span>
        </button>
        <button class="nav-item" data-modulo="manutencao">
          <span class="nav-icon">🗓️</span><span>Prazos de manutenção</span>
        </button>
      </div>
      <div class="nav-grupo"><div class="nav-titulo">Administração</div>
        <div class="nav-sub"><div class="nav-subtitulo">RH</div>
        <button class="nav-item admin-only" data-modulo="funcionarios">
          <span class="nav-icon">👨‍💼</span><span>Funcionários</span>
        </button>
        </div>
        <div class="nav-sub"><div class="nav-subtitulo">Finanças</div>
        <button class="nav-item" data-modulo="financeiro">
          <span class="nav-icon">💰</span><span>Financeiro</span>
        </button>
        </div>
      </div>
      <div class="nav-grupo"><div class="nav-titulo">Configuração</div>
        <button class="nav-item admin-only" data-modulo="configuracoes">
          <span class="nav-icon">⚙️</span><span>Configurações</span>
        </button>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="utilizador-info">
        <div class="utilizador-avatar" id="sidebar-avatar">A</div>
        <div>
          <div id="sidebar-nome">---</div>
          <div id="sidebar-cargo" class="texto-pequeno muted">---</div>
        </div>
      </div>
      <button class="btn-logout" data-action="logout" title="Sair">⏻</button>
    </div>
  </aside>

  <!-- Overlay mobile -->
  <div id="sidebar-overlay" class="sidebar-overlay" data-action="toggle-sidebar"></div>

  <!-- Conteúdo principal -->
  <main class="main-content">
    <header class="topbar">
      <button class="btn-menu" data-action="toggle-sidebar">☰</button>
      <h2 id="topbar-titulo">Dashboard</h2>
      <div class="topbar-direita">
        <span id="ws-status" class="ws-badge ws-desconectado" title="WebSocket">●</span>
        <span id="hora-atual" class="hora-atual"></span>
      </div>
    </header>
    <div id="main-content" class="content-area">
      <div class="loading-spinner">A carregar...</div>
    </div>
  </main>
</div>

<!-- ── MODAIS GLOBAIS ──────────────────────────────────── -->
<div id="modal-overlay" class="modal-overlay" style="display:none" data-action="fechar-modal">
  <div id="modal-box" class="modal-box">
    <div class="modal-header">
      <h3 id="modal-titulo">Título</h3>
      <button class="btn-fechar-modal" data-action="fechar-modal">✕</button>
    </div>
    <div id="modal-corpo"></div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/pwa.js" defer></script>
<script src="/js/nukpos.js"></script>
<script src="/js/modulos.js"></script>
<script src="/js/venda.js"></script>
<script src="/js/caixa.js"></script>
<script src="/js/compras.js"></script>
<script src="/js/servicos.js"></script>
</body>
</html>
