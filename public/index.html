<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuk_POS</title>
<link rel="stylesheet" href="/css/nukpos.css">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/icon-192.png">
<link rel="stylesheet" href="/css/marca.css">
</head>
<body>

<!-- ── LOGIN ─────────────────────────────────────────── -->
<div id="tela-login" class="tela-login">
  <div class="login-card">
    <div class="login-logo">
      <span class="marca marca--xl"><img src="/img/logo-nukpos.png" alt="Nuk_POS Sistema Integrado" width="597" height="405"></span>
    </div>
    <form id="form-login">
      <div class="campo">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="email@nukpos.ao" autocomplete="username" required>
      </div>
      <div class="campo">
        <label>Senha</label>
        <input type="password" id="login-senha" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primario btn-bloco" id="btn-entrar">Entrar</button>
      <div id="login-erro" class="erro-msg" style="display:none"></div>
    </form>
  </div>
</div>

<!-- ── APP PRINCIPAL ──────────────────────────────────── -->
<div id="app" style="display:none">

  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo"><span class="marca marca--sm"><img src="/img/logo-nukpos.png" alt="Nuk_POS Sistema Integrado" width="597" height="405"></span></div>
      <button class="btn-fechar-sidebar" data-action="toggle-sidebar">✕</button>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-modulo="dashboard">
        <span class="nav-icon">📊</span><span>Dashboard</span>
      </button>
      <button class="nav-item" data-modulo="pedidos">
        <span class="nav-icon">🍽️</span><span>Pedidos</span>
        <span id="badge-pedidos" class="badge" style="display:none">0</span>
      </button>
      <button class="nav-item" data-modulo="mesas">
        <span class="nav-icon">🪑</span><span>Mesas</span>
      </button>
      <button class="nav-item" data-modulo="quartos">
        <span class="nav-icon">🛏️</span><span>Quartos</span>
      </button>
      <button class="nav-item" data-modulo="solicitacoes">
        <span class="nav-icon">🔔</span><span>Solicitações</span>
        <span id="badge-solicitacoes" class="badge" style="display:none">0</span>
      </button>
      <button class="nav-item" data-modulo="produtos">
        <span class="nav-icon">📋</span><span>Menu / Produtos</span>
      </button>
      <button class="nav-item" data-modulo="stock">
        <span class="nav-icon">📦</span><span>Stock</span>
        <span id="badge-stock" class="badge badge-aviso" style="display:none">!</span>
      </button>
      <button class="nav-item" data-modulo="financeiro">
        <span class="nav-icon">💰</span><span>Financeiro</span>
      </button>
      <button class="nav-item" data-modulo="clientes">
        <span class="nav-icon">👥</span><span>Clientes</span>
      </button>
      <button class="nav-item admin-only" data-modulo="funcionarios">
        <span class="nav-icon">👨‍💼</span><span>Funcionários</span>
      </button>
      <button class="nav-item admin-only" data-modulo="configuracoes">
        <span class="nav-icon">⚙️</span><span>Configurações</span>
      </button>
    </nav>
    <div class="sidebar-footer">
      <div class="utilizador-info">
        <div class="utilizador-avatar" id="sidebar-avatar">A</div>
        <div>
          <div id="sidebar-nome">---</div>
          <div id="sidebar-cargo" class="texto-pequeno muted">---</div>
        </div>
      </div>
      <button class="btn-logout" data-action="logout" title="Sair">⏻</button>
    </div>
  </aside>

  <!-- Overlay mobile -->
  <div id="sidebar-overlay" class="sidebar-overlay" data-action="toggle-sidebar"></div>

  <!-- Conteúdo principal -->
  <main class="main-content">
    <header class="topbar">
      <button class="btn-menu" data-action="toggle-sidebar">☰</button>
      <h2 id="topbar-titulo">Dashboard</h2>
      <div class="topbar-direita">
        <span id="ws-status" class="ws-badge ws-desconectado" title="WebSocket">●</span>
        <span id="hora-atual" class="hora-atual"></span>
      </div>
    </header>
    <div id="main-content" class="content-area">
      <div class="loading-spinner">A carregar...</div>
    </div>
  </main>
</div>

<!-- ── MODAIS GLOBAIS ──────────────────────────────────── -->
<div id="modal-overlay" class="modal-overlay" style="display:none" data-action="fechar-modal">
  <div id="modal-box" class="modal-box">
    <div class="modal-header">
      <h3 id="modal-titulo">Título</h3>
      <button class="btn-fechar-modal" data-action="fechar-modal">✕</button>
    </div>
    <div id="modal-corpo"></div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="https://cdn.socket.io/4.6.2/socket.io.min.js"></script>
<script src="/js/nukpos.js"></script>
<script src="/js/modulos.js"></script>
</body>
</html>
