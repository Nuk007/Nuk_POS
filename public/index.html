<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nuk_POS</title>
<link rel="stylesheet" href="/css/nukpos.css">
<link rel="icon" type="image/png" href="/img/favicon.png">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Nuk_POS">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/pwa.css">

<link rel="stylesheet" href="/css/botoes.css">
</head>
<body>

<!-- ── SPLASH (arranque do sistema) ─────────────────────
     Mesma imagem usada no formulário principal (login), abaixo — só a escrita, sem emblema
     por cima (pedido do utilizador em 01/11/2026: "não quero nada por cima da escrita").
     Desaparece sozinho ao fim de pouco tempo — ver nukpos.js. ─────────────────────────────── -->
<div id="tela-splash" class="tela-splash">
  <span class="marca marca--xl"><img src="/img/logo-nukpos-texto.png" alt="Nuk_POS Sistema Integrado" width="597" height="176"></span>
</div>

<!-- ── LOGIN ─────────────────────────────────────────── -->
<div id="tela-login" class="tela-login">
  <div class="login-card">
    <div class="login-logo">
      <span class="marca marca--xl"><img src="/img/logo-nukpos-texto.png" alt="Nuk_POS Sistema Integrado" width="597" height="176"></span>
    </div>
    <form id="form-login">
      <div class="campo">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="email@nukpos.ao" autocomplete="username" required>
      </div>
      <div class="campo">
        <label>Senha</label>
        <input type="password" id="login-senha" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primario btn-bloco" id="btn-entrar">Entrar</button>
      <div id="login-erro" class="erro-msg" style="display:none"></div>
    </form>
  </div>
</div>

<!-- ── CONTRATO DE ADESÃO (13/11/2026) ───────────────── -->
<!-- Antes da operação: o administrador titular lê e assina a adesão à Plataforma Nuk_POS da GESTNUK AI. -->
<div id="tela-adesao" class="tela-adesao" style="display:none">
  <div class="adesao-card">
    <div class="adesao-topo">
      <span class="marca"><img src="/img/logo-nukpos-texto.png" alt="Nuk_POS" width="597" height="176"></span>
      <button type="button" class="btn-secundario" id="adesao-sair">Sair</button>
    </div>
    <h2 class="adesao-titulo">Contrato de Adesão à Plataforma</h2>
    <p id="adesao-intro" class="muted"></p>
    <div id="adesao-texto" class="adesao-texto"></div>
    <form id="form-adesao" style="display:none">
      <div class="campo">
        <label for="adesao-nome">O seu nome completo</label>
        <input type="text" id="adesao-nome" minlength="5" maxlength="160" autocomplete="name" required>
      </div>
      <label class="adesao-aceito"><input type="checkbox" id="adesao-aceito" required> Li o contrato e aceito-o em nome do estabelecimento.</label>
      <button type="submit" class="btn-primario btn-bloco" id="btn-adesao">Assinar o contrato</button>
      <div id="adesao-erro" class="erro-msg" style="display:none"></div>
    </form>
    <div id="adesao-aviso" class="aviso-msg" style="display:none">O administrador titular do estabelecimento tem de assinar este contrato antes de a operação ficar disponível. Pode lê-lo acima.</div>
  </div>
</div>

<!-- ── LICENÇA EXPIRADA / CONTA SUSPENSA (14/11/2026) ─────────── -->
<div id="tela-licenca" class="tela-adesao tela-licenca" style="display:none">
  <div class="adesao-card licenca-card">
    <div class="adesao-topo">
      <span class="marca"><img src="/img/logo-nukpos-texto.png" alt="Nuk_POS" width="597" height="176"></span>
      <button type="button" class="btn-secundario" id="licenca-sair">Sair</button>
    </div>
    <div class="licenca-icone" aria-hidden="true">🔒</div>
    <h2 class="adesao-titulo" id="licenca-titulo">A licença expirou</h2>
    <p id="licenca-texto"></p>
    <p id="licenca-dados" class="muted"></p>
    <div class="licenca-accoes">
      <a id="licenca-suporte" class="btn-primario" target="_blank" rel="noopener" style="display:none">💬 Falar com o suporte no WhatsApp</a>
      <button type="button" class="btn-secundario" id="licenca-tentar">Já renovei — entrar</button>
    </div>
  </div>
</div>

<!-- ── APP PRINCIPAL ──────────────────────────────────── -->

        </button>

        <div class="nav-sub"><button type="button" class="nav-subtitulo sem-relevo" data-action="nav-sub" aria-expanded="false"><span>Fluxo de venda</span><span class="nav-seta" aria-hidden="true">›</span></button>
        <button class="nav-item" data-modulo="mesas">
          <span class="nav-icon">🪑</span><span>Mesa</span>
        </button>
        <button class="nav-item" data-modulo="balcao">
          <span class="nav-icon">🧾</span><span>Balcão</span>
        </button>
        <button class="nav-item" data-modulo="remota">
          <span class="nav-icon">📱</span><span>Remota</span>

        </button>
        <button class="nav-item" data-modulo="takeaway">

        <button class="nav-item" data-modulo="produtos">

        <button class="nav-item" data-modulo="loja">
          <span class="nav-icon">🛍️</span><span>Loja</span>

        </div>
        <div class="nav-sub"><button type="button" class="nav-subtitulo sem-relevo" data-action="nav-sub" aria-expanded="false"><span>Hospedagem</span><span class="nav-seta" aria-hidden="true">›</span></button>

          <span class="nav-icon">🛠️</span><span>Avarias e danos</span>

          <span class="nav-icon">🗓️</span><span>Prazos de manutenção</span>

        </div>
      </div>
      <button class="btn-logout" data-action="logout" title="Sair">⏻</button>
    </div>
  </aside>

  <!-- Overlay mobile -->
  <div id="sidebar-overlay" class="sidebar-overlay" data-action="toggle-sidebar"></div>

  <!-- Conteúdo principal -->
  <main class="main-content">
    <header class="topbar">
      <button class="btn-menu" data-action="toggle-sidebar">☰</button>
      <h2 id="topbar-titulo">Dashboard</h2>
      <div class="topbar-direita">
        <button id="offline-estado" class="btn-secundario" style="display:none;padding:.3rem .7rem;font-size:.8rem" title="Pedidos feitos sem internet" data-on-click="modalOffline()"></button>
        <button id="btn-cadeia" class="btn-secundario" style="display:none;padding:.3rem .7rem;font-size:.8rem" title="Mudar de estabelecimento" data-on-click="modalCadeia()">🏢</button>
        <button id="btn-impressora" class="btn-secundario" style="display:none;padding:.3rem .7rem;font-size:.8rem" title="Impressora deste dispositivo" data-on-click="modalImpressora()">🖨️</button>
        <button id="btn-ponto" class="btn-secundario" style="display:none;padding:.3rem .7rem;font-size:.8rem" data-on-click="clicarPonto()">🕒 Registar entrada</button>
        <span id="ws-status" class="ws-badge ws-desconectado" title="WebSocket">●</span>
        <span id="hora-atual" class="hora-atual"></span>
      </div>
    </header>
    <div id="aviso-licenca" class="aviso-licenca" style="display:none" role="status">

      <div class="loading-spinner">A carregar...</div>
    </div>

</div>
