<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sem ligação — Nuk_POS</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<style>
  :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --accent:#E8650A; color-scheme: dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--fg);
         font-family:system-ui,-apple-system,"Segoe UI",sans-serif; padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left)); text-align:center; }

  p { color:var(--muted); max-width:28rem; margin:0 auto 1.2rem; line-height:1.5; }
  a { display:inline-block; background:var(--accent); color:#fff; text-decoration:none; padding:.75rem 1.4rem; border-radius:10px; font-weight:600; }
</style>
</head>
<body>
  <main>
    <img src="/img/icon-192.png" alt="Nuk_POS" width="96" height="96">

    <a href="/">Tentar de novo</a>
