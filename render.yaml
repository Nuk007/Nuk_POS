services:
  - type: web
    name: nukpos
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    disk:
      name: nukpos-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: nukpos-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://nukpos.onrender.com
      - key: BASE_URL
        value: https://nukpos.onrender.com
      # ── SaaS / Multi-tenant ───────────────────────────────────
      - key: SUPERADMIN_KEY
        generateValue: true          # Render gera automaticamente; guarda o valor nos Settings
      # ── Twilio WhatsApp API ───────────────────────────────────
      - key: TWILIO_ACCOUNT_SID
        sync: false                  # Definir manualmente em Render > Environment
      - key: TWILIO_AUTH_TOKEN
        sync: false                  # Definir manualmente em Render > Environment
      - key: TWILIO_WHATSAPP_FROM
        value: whatsapp:+14155238886 # Número sandbox por defeito; substituir pelo número aprovado

databases:
  - name: nukpos-db
    databaseName: nukpos
    user: nukpos_user
    plan: free
